<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Proyek Portofolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React & Babel for Single-File Reactive UI -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .aspect-16-9 {
            aspect-ratio: 16 / 9;
        }
        /* Smooth transitions */
        .trans-all {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- KOMPONEN TOAST NOTIFICATION (Pengganti alert) ---
        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgClass = type === 'error' ? 'bg-red-600' : 'bg-emerald-600';
            return (
                <div className={`fixed bottom-5 right-5 ${bgClass} text-white px-5 py-3 rounded-lg shadow-xl z-50 flex items-center space-x-3 transition-all transform translate-y-0`}>
                    <i className={type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle'}></i>
                    <span className="text-sm font-medium">{message}</span>
                    <button onClick={onClose} className="ml-2 hover:opacity-75"><i className="fas fa-times"></i></button>
                </div>
            );
        }

        // --- HELPER UNTUK MENGAMBIL YOUTUBE EMBED URL ---
        function getYouTubeEmbedUrl(url) {
            if (!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : url;
        }

        function App() {
            // State Utama Proyek
            const [project, setProject] = useState(() => {
                const saved = localStorage.getItem('portfolio_project_data');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) {}
                }
                return {
                    title: 'MASUKAN JUDUL PROYEK',
                    subtitle: 'Sub-judul atau deskripsi singkat proyek Anda',
                    bgImage: '', // Storage URL Base64 dari file lokal
                    bgOverlayOpacity: 0.4,
                    bgBlur: 0,
                    titleColor: '#ffffff',
                    elements: []
                };
            });

            // State Mode Tampilan: 'editor' | 'published'
            const [viewMode, setViewMode] = useState('editor');
            const [toast, setToast] = useState(null);
            const [showBannerControls, setShowBannerControls] = useState(false);

            // Simpan otomatis draft lokal
            useEffect(() => {
                localStorage.setItem('portfolio_project_data', JSON.stringify(project));
            }, [project]);

            const showNotification = (msg, type = 'success') => {
                setToast({ message: msg, type });
            };

            const handleBannerImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    showNotification('Harap pilih file gambar (JPG, PNG, WebP, GIF)', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    setProject(prev => ({ ...prev, bgImage: event.target.result }));
                    showNotification('Gambar latar belakang 16:9 berhasil diperbarui!');
                };
                reader.readAsDataURL(file);
            };

            // Tambah elemen baru ke kanvas
            const addElement = (type, customPayload = {}) => {
                const newElem = {
                    id: 'elem_' + Date.now(),
                    type,
                    ...getDefaultElementData(type),
                    ...customPayload
                };
                setProject(prev => ({
                    ...prev,
                    elements: [...prev.elements, newElem]
                }));
                showNotification(`Elemen '${type}' ditambahkan ke kanvas`);
            };

            const getDefaultElementData = (type) => {
                switch (type) {
                    case 'text':
                        return { text: 'Klik di sini untuk merubah atau mengetik teks baru Anda.', style: 'paragraph' };
                    case 'image':
                        return { url: '', caption: 'Keterangan gambar', align: 'center', size: 'full' };
                    case 'layout_2col':
                        return { 
                            col1Type: 'text', col1Text: 'Kolom Kiri: Tuliskan informasi atau deskripsi di sini.', col1Image: '',
                            col2Type: 'image', col2Text: 'Kolom Kanan', col2Image: ''
                        };
                    case 'collapsible':
                        return { title: 'Teks Terlipat (Klik untuk membuka)', content: 'Ini adalah isi teks terlipat yang dapat disembunyikan atau ditampilkan.', isOpen: false };
                    case 'callout':
                        return { text: 'Ini adalah Kotak Sorotan (Callout) untuk menekankan poin penting!', icon: 'fa-info-circle', bgType: 'info' };
                    case 'button':
                        return { label: 'Kunjungi Tautan', url: 'https://github.com', align: 'center', style: 'primary' };
                    case 'youtube':
                        return { url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' };
                    case 'divider':
                        return { style: 'solid' };
                    default:
                        return {};
                }
            };

            // Hapus Elemen
            const deleteElement = (id) => {
                setProject(prev => ({
                    ...prev,
                    elements: prev.elements.filter(el => el.id !== id)
                }));
                showNotification('Elemen telah dihapus', 'info');
            };

            // Pindah Urutan Elemen
            const moveElement = (index, direction) => {
                const newElements = [...project.elements];
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= newElements.length) return;
                const temp = newElements[index];
                newElements[index] = newElements[targetIndex];
                newElements[targetIndex] = temp;
                setProject(prev => ({ ...prev, elements: newElements }));
            };

            // Update isi elemen
            const updateElement = (id, key, value) => {
                setProject(prev => ({
                    ...prev,
                    elements: prev.elements.map(el => el.id === id ? { ...el, [key]: value } : el)
                }));
            };

            // Handler simpan & publikasikan
            const handlePublish = () => {
                localStorage.setItem('published_portfolio_project', JSON.stringify(project));
                setViewMode('published');
                showNotification('Proyek berhasil dipublikasikan!');
            };

            if (viewMode === 'published') {
                return (
                    <div className="min-h-screen bg-gray-50 pb-20">
                        {/* Bar Navigasi Mode Publikasi */}
                        <div className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center sticky top-0 z-40 shadow-lg">
                            <div className="flex items-center space-x-3">
                                <span className="bg-emerald-500 text-xs px-2.5 py-1 rounded-full font-bold uppercase tracking-wider">Terpublikasi</span>
                                <span className="text-sm text-slate-300 hidden md:inline">Pratinjau Halaman Publik</span>
                            </div>
                            <button 
                                onClick={() => setViewMode('editor')}
                                className="bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center space-x-2 border border-slate-700"
                            >
                                <i className="fas fa-edit"></i>
                                <span>Kembali ke Editor Proyek</span>
                            </button>
                        </div>

                        {/* Container Halaman Utama */}
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 pt-6">
                            {/* Banner Latar Belakang 16:9 */}
                            <div 
                                className="relative w-full aspect-16-9 bg-slate-900 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center text-center p-6 bg-cover bg-center mb-8 border border-slate-200"
                                style={{ 
                                    backgroundImage: project.bgImage ? `url(${project.bgImage})` : 'none',
                                    filter: project.bgBlur ? `blur(${project.bgBlur}px)` : 'none'
                                }}
                            >
                                {/* Overlay Gelap */}
                                <div 
                                    className="absolute inset-0 bg-black transition-opacity" 
                                    style={{ opacity: project.bgOverlayOpacity }}
                                ></div>

                                {/* Judul Banner */}
                                <div className="relative z-10 max-w-3xl">
                                    <h1 
                                        className="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight drop-shadow-md"
                                        style={{ color: project.titleColor }}
                                    >
                                        {project.title || 'MASUKAN JUDUL PROYEK'}
                                    </h1>
                                    {project.subtitle && (
                                        <p className="mt-4 text-base sm:text-xl text-gray-200 font-medium drop-shadow">
                                            {project.subtitle}
                                        </p>
                                    )}
                                </div>
                            </div>

                            {/* Isi Konten Kanvas Proyek */}
                            <div className="bg-white rounded-2xl shadow-xl p-6 sm:p-10 space-y-8 min-h-[400px]">
                                {project.elements.length === 0 ? (
                                    <div className="text-center py-16 text-gray-400">
                                        <i className="fas fa-file-alt text-5xl mb-3"></i>
                                        <p className="text-lg">Belum ada elemen konten pada proyek ini.</p>
                                    </div>
                                ) : (
                                    project.elements.map(elem => (
                                        <PublishedElementRenderer key={elem.id} elem={elem} />
                                    ))
                                )}
                            </div>
                        </div>

                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    {/* Header Top Bar */}
                    <header className="bg-white border-b border-gray-200 px-4 sm:px-6 py-3 flex justify-between items-center sticky top-0 z-30 shadow-sm">
                        <button 
                            onClick={() => showNotification('Navigasi kembali diklik', 'info')}
                            className="text-gray-600 hover:text-gray-900 font-medium text-sm flex items-center space-x-2 py-1.5 px-3 rounded-lg hover:bg-gray-100 transition"
                        >
                            <i className="fas fa-arrow-left text-xs"></i>
                            <span>← Keluar</span>
                        </button>

                        <h1 className="text-lg font-bold text-gray-800 tracking-tight">
                            Editor Proyek
                        </h1>

                        <button 
                            onClick={handlePublish}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-5 py-2 rounded-lg shadow-sm hover:shadow transition flex items-center space-x-2"
                        >
                            <i className="fas fa-paper-plane text-xs"></i>
                            <span>Simpan & Publikasikan</span>
                        </button>
                    </header>

                    {/* Body Utama Editor: Kanvas (Kiri/Tengah) & Sidebar Sisipkan Elemen (Kanan) */}
                    <div className="flex-1 flex flex-col lg:flex-row max-w-7xl w-full mx-auto p-4 sm:p-6 gap-6">
                        
                        {/* AREA KANVAS UTAMA */}
                        <main className="flex-1 space-y-6">
                            
                            {/* 1. BANNER HEADER RASIO 16:9 */}
                            <div className="relative w-full aspect-16-9 bg-slate-900 rounded-xl overflow-hidden shadow-lg border border-slate-300 group flex items-center justify-center text-center p-6 bg-cover bg-center">
                                {/* Latar Belakang Gambar jika diunggah */}
                                {project.bgImage ? (
                                    <div 
                                        className="absolute inset-0 bg-cover bg-center transition-all"
                                        style={{ 
                                            backgroundImage: `url(${project.bgImage})`,
                                            filter: project.bgBlur ? `blur(${project.bgBlur}px)` : 'none'
                                        }}
                                    ></div>
                                ) : null}

                                {/* Overlay Warna Gelap */}
                                <div 
                                    className="absolute inset-0 bg-black transition-opacity"
                                    style={{ opacity: project.bgOverlayOpacity }}
                                ></div>

                                {/* Konten Header (Judul Editable) */}
                                <div className="relative z-10 w-full max-w-2xl px-4">
                                    <input 
                                        type="text"
                                        value={project.title}
                                        onChange={(e) => setProject({ ...project, title: e.target.value })}
                                        placeholder="MASUKAN JUDUL PROYEK"
                                        className="w-full text-center bg-black/40 hover:bg-black/60 focus:bg-black/80 text-2xl sm:text-4xl md:text-5xl font-extrabold uppercase tracking-wide text-white p-3 rounded-lg border border-white/20 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition"
                                        style={{ color: project.titleColor }}
                                    />
                                    <p className="mt-2 text-xs text-white/70 italic">
                                        Tip: Klik teks di atas untuk langsung mengubah judul proyek Anda.
                                    </p>
                                </div>

                                {/* Tombol Ubah Latar Belakang & Pengaturan Banner (16:9) */}
                                <div className="absolute bottom-4 right-4 z-20 flex items-center space-x-2">
                                    <button 
                                        onClick={() => setShowBannerControls(!showBannerControls)}
                                        className="bg-slate-800/90 hover:bg-slate-900 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow backdrop-blur-sm border border-slate-600 transition flex items-center space-x-1.5"
                                        title="Pengaturan Overlay & Warna"
                                    >
                                        <i className="fas fa-sliders-h"></i>
                                        <span className="hidden sm:inline">Efek Overlay</span>
                                    </button>

                                    <label className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow cursor-pointer transition flex items-center space-x-2">
                                        <i className="fas fa-camera"></i>
                                        <span>📷 Ubah Latar Belakang (16:9)</span>
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            className="hidden" 
                                            onChange={handleBannerImageUpload} 
                                        />
                                    </label>
                                </div>

                                {/* Badge Penunjuk Rasio 16:9 */}
                                <div className="absolute top-4 left-4 z-20 bg-black/60 text-white/80 text-[10px] font-mono px-2.5 py-1 rounded-md backdrop-blur-sm border border-white/10">
                                    Rasio Banner: 16:9
                                </div>

                                {/* Popover Pengaturan Banner */}
                                {showBannerControls && (
                                    <div className="absolute bottom-16 right-4 z-30 bg-white text-slate-800 p-4 rounded-xl shadow-2xl border border-gray-200 w-72 text-left space-y-3">
                                        <div className="flex justify-between items-center border-b pb-2">
                                            <span className="font-bold text-xs uppercase tracking-wider text-slate-600">Latar 16:9 Controls</span>
                                            <button onClick={() => setShowBannerControls(false)} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times"></i></button>
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold block mb-1">Kegelapan Overlay: {Math.round(project.bgOverlayOpacity * 100)}%</label>
                                            <input 
                                                type="range" 
                                                min="0" 
                                                max="0.9" 
                                                step="0.05"
                                                value={project.bgOverlayOpacity}
                                                onChange={(e) => setProject({ ...project, bgOverlayOpacity: parseFloat(e.target.value) })}
                                                className="w-full accent-emerald-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold block mb-1">Efek Blur Latar: {project.bgBlur}px</label>
                                            <input 
                                                type="range" 
                                                min="0" 
                                                max="10" 
                                                step="1"
                                                value={project.bgBlur}
                                                onChange={(e) => setProject({ ...project, bgBlur: parseInt(e.target.value) })}
                                                className="w-full accent-emerald-600"
                                            />
                                        </div>
                                        {project.bgImage && (
                                            <button 
                                                onClick={() => setProject({ ...project, bgImage: '' })}
                                                className="w-full bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold py-1.5 rounded border border-red-200"
                                            >
                                                Hapus Latar Belakang Gambar
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>

                            {}
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 sm:p-8 min-h-[380px]">
                                {project.elements.length === 0 ? (
                                    /* Tampilan Kanvas Kosong (Sama persis seperti pada Screenshot) */
                                    <div className="h-64 flex flex-col items-center justify-center text-center">
                                        <p className="text-gray-400 italic text-base sm:text-lg">
                                            Kanvas Kosong.
                                        </p>
                                        <p className="text-gray-400 italic text-sm mt-1">
                                            Gunakan menu di sebelah kanan untuk menyisipkan elemen.
                                        </p>
                                    </div>
                                ) : (
                                    /* Daftar Elemen Terisi di Kanvas Editor */
                                    <div className="space-y-6">
                                        {project.elements.map((elem, idx) => (
                                            <div key={elem.id} className="relative group border border-dashed border-slate-300 hover:border-emerald-500 rounded-xl p-4 transition bg-slate-50/50 hover:bg-white">
                                                {/* Toolbar Aksi Elemen */}
                                                <div className="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity bg-white border border-gray-200 rounded-lg shadow-sm px-2 py-1 flex items-center space-x-1 z-10">
                                                    <button 
                                                        onClick={() => moveElement(idx, -1)} 
                                                        disabled={idx === 0}
                                                        className="p-1 hover:bg-gray-100 text-gray-600 rounded disabled:opacity-30 text-xs"
                                                        title="Pindah ke atas"
                                                    >
                                                        <i className="fas fa-arrow-up"></i>
                                                    </button>
                                                    <button 
                                                        onClick={() => moveElement(idx, 1)} 
                                                        disabled={idx === project.elements.length - 1}
                                                        className="p-1 hover:bg-gray-100 text-gray-600 rounded disabled:opacity-30 text-xs"
                                                        title="Pindah ke bawah"
                                                    >
                                                        <i className="fas fa-arrow-down"></i>
                                                    </button>
                                                    <span className="text-gray-300">|</span>
                                                    <button 
                                                        onClick={() => deleteElement(elem.id)}
                                                        className="p-1 hover:bg-red-50 text-red-600 rounded text-xs"
                                                        title="Hapus Elemen"
                                                    >
                                                        <i className="fas fa-trash-alt"></i>
                                                    </button>
                                                </div>

                                                {/* Component Form Editor untuk Masing-masing Elemen */}
                                                <EditableElementEditor 
                                                    elem={elem} 
                                                    updateElement={updateElement} 
                                                    showNotification={showNotification}
                                                />
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </main>

                        {}
                        <aside className="w-full lg:w-80 bg-white rounded-xl shadow-sm border border-gray-200 p-5 self-start sticky top-20">
                            <h2 className="text-center font-semibold text-emerald-700 text-sm tracking-wide border-b border-emerald-500 pb-2 mb-4 uppercase">
                                Sisipkan Elemen
                            </h2>

                            <div className="space-y-6">
                                {/* Quick Access Grid: Teks & Gambar */}
                                <div className="grid grid-cols-2 gap-3">
                                    <button 
                                        onClick={() => addElement('text')}
                                        className="flex flex-col items-center justify-center p-4 border border-gray-200 rounded-xl hover:border-emerald-500 hover:bg-emerald-50/50 transition group"
                                    >
                                        <span className="text-2xl font-bold text-emerald-700 group-hover:scale-110 transition-transform mb-1">Tt</span>
                                        <span className="text-xs font-semibold text-gray-700">Teks</span>
                                    </button>

                                    <button 
                                        onClick={() => addElement('image')}
                                        className="flex flex-col items-center justify-center p-4 border border-gray-200 rounded-xl hover:border-emerald-500 hover:bg-emerald-50/50 transition group"
                                    >
                                        <i className="fas fa-image text-2xl text-emerald-600 group-hover:scale-110 transition-transform mb-1"></i>
                                        <span className="text-xs font-semibold text-gray-700">Gambar</span>
                                    </button>
                                </div>

                                {/* Section: TATA LETAK (LAYOUT) */}
                                <div>
                                    <h3 className="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">
                                        TATA LETAK (LAYOUT)
                                    </h3>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button 
                                            onClick={() => addElement('layout_2col', { col1Type: 'image', col2Type: 'text' })}
                                            className="p-2.5 border border-gray-200 rounded-lg hover:border-emerald-500 hover:bg-emerald-50/30 flex items-center justify-center space-x-2 transition"
                                        >
                                            <div className="w-4 h-4 bg-emerald-300 rounded-sm"></div>
                                            <div className="w-6 h-1 bg-gray-300 rounded"></div>
                                        </button>
                                        <button 
                                            onClick={() => addElement('layout_2col', { col1Type: 'text', col2Type: 'image' })}
                                            className="p-2.5 border border-gray-200 rounded-lg hover:border-emerald-500 hover:bg-emerald-50/30 flex items-center justify-center space-x-2 transition"
                                        >
                                            <div className="w-6 h-1 bg-gray-300 rounded"></div>
                                            <div className="w-4 h-4 bg-emerald-300 rounded-sm"></div>
                                        </button>
                                    </div>
                                </div>

                                {/* Section: FITUR SPESIAL */}
                                <div className="space-y-2">
                                    <h3 className="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">
                                        FITUR SPESIAL
                                    </h3>

                                    <button 
                                        onClick={() => addElement('collapsible')}
                                        className="w-full text-left p-3 border border-gray-200 rounded-xl hover:border-emerald-500 hover:bg-emerald-50/40 text-xs font-semibold text-gray-700 flex items-center justify-between transition"
                                    >
                                        <span>Teks Terlipat (Collapsible)</span>
                                        <i className="fas fa-chevron-down text-gray-400"></i>
                                    </button>

                                    <button 
                                        onClick={() => addElement('callout')}
                                        className="w-full text-left p-3 border border-gray-200 rounded-xl hover:border-emerald-500 hover:bg-emerald-50/40 text-xs font-semibold text-gray-700 flex items-center justify-between transition"
                                    >
                                        <span>Kotak Sorotan (Callout)</span>
                                        <i className="fas fa-highlighter text-gray-400"></i>
                                    </button>

                                    <button 
                                        onClick={() => addElement('button')}
                                        className="w-full text-left p-3 border border-gray-200 rounded-xl hover:border-emerald-500 hover:bg-emerald-50/40 text-xs font-semibold text-gray-700 flex items-center justify-between transition"
                                    >
                                        <span>Tombol Link</span>
                                        <i className="fas fa-link text-gray-400"></i>
                                    </button>

                                    <button 
                                        onClick={() => addElement('youtube')}
                                        className="w-full text-left p-3 border border-gray-200 rounded-xl hover:border-emerald-500 hover:bg-emerald-50/40 text-xs font-semibold text-gray-700 flex items-center justify-between transition"
                                    >
                                        <span>Video YouTube</span>
                                        <i className="fab fa-youtube text-red-500"></i>
                                    </button>

                                    <button 
                                        onClick={() => addElement('divider')}
                                        className="w-full text-left p-3 border border-gray-200 rounded-xl hover:border-emerald-500 hover:bg-emerald-50/40 text-xs font-semibold text-gray-700 flex items-center justify-between transition"
                                    >
                                        <span>Garis Pembatas</span>
                                        <i className="fas fa-minus text-gray-400"></i>
                                    </button>
                                </div>
                            </div>
                        </aside>

                    </div>

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        }

        function EditableElementEditor({ elem, updateElement, showNotification }) {

            // File reader lokal untuk upload gambar di dalam kanvas
            const handleLocalImageUpload = (e, keyName = 'url') => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    showNotification('Harap pilih berkas gambar!', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (evt) => {
                    updateElement(elem.id, keyName, evt.target.result);
                    showNotification('Gambar berhasil diunggah!');
                };
                reader.readAsDataURL(file);
            };

            switch (elem.type) {
                case 'text':
                    return (
                        <div className="space-y-2">
                            <div className="flex justify-between items-center text-xs text-gray-500 mb-1">
                                <span className="font-semibold uppercase tracking-wider text-emerald-700">Teks</span>
                                <select 
                                    value={elem.style} 
                                    onChange={(e) => updateElement(elem.id, 'style', e.target.value)}
                                    className="border border-gray-200 rounded px-2 py-1 text-xs bg-white focus:outline-none"
                                >
                                    <option value="heading">Judul Besar (Heading)</option>
                                    <option value="subheading">Sub-Judul</option>
                                    <option value="paragraph">Paragraf Normal</option>
                                </select>
                            </div>
                            <textarea
                                value={elem.text}
                                onChange={(e) => updateElement(elem.id, 'text', e.target.value)}
                                rows={elem.style === 'paragraph' ? 3 : 1}
                                className={`w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none transition ${
                                    elem.style === 'heading' ? 'text-2xl font-bold' : elem.style === 'subheading' ? 'text-lg font-semibold' : 'text-sm'
                                }`}
                                placeholder="Tuliskan teks di sini..."
                            />
                        </div>
                    );

                case 'image':
                    return (
                        <div className="space-y-3">
                            <div className="flex justify-between items-center text-xs text-gray-500">
                                <span className="font-semibold uppercase tracking-wider text-emerald-700">Gambar</span>
                                <div className="flex space-x-2">
                                    <select 
                                        value={elem.align} 
                                        onChange={(e) => updateElement(elem.id, 'align', e.target.value)}
                                        className="border border-gray-200 rounded px-2 py-1 text-xs bg-white"
                                    >
                                        <option value="left">Rata Kiri</option>
                                        <option value="center">Rata Tengah</option>
                                        <option value="right">Rata Kanan</option>
                                    </select>
                                </div>
                            </div>

                            {elem.url ? (
                                <div className={`relative group/img ${elem.align === 'center' ? 'text-center' : elem.align === 'right' ? 'text-right' : 'text-left'}`}>
                                    <img 
                                        src={elem.url} 
                                        alt="Uploaded" 
                                        className="max-h-80 rounded-xl object-cover inline-block border border-gray-200 shadow-sm"
                                    />
                                    <div className="mt-2">
                                        <label className="text-xs text-emerald-600 hover:text-emerald-800 cursor-pointer font-semibold inline-flex items-center space-x-1">
                                            <i className="fas fa-sync-alt"></i>
                                            <span>Ganti Gambar File Lokal</span>
                                            <input 
                                                type="file" 
                                                accept="image/*" 
                                                className="hidden" 
                                                onChange={(e) => handleLocalImageUpload(e)} 
                                            />
                                        </label>
                                    </div>
                                </div>
                            ) : (
                                <div className="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-emerald-500 transition">
                                    <i className="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2"></i>
                                    <p className="text-xs text-gray-600 mb-3 font-medium">Unggah gambar langsung dari berkas perangkat Anda</p>
                                    <label className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-lg cursor-pointer transition inline-flex items-center space-x-2">
                                        <i className="fas fa-folder-open"></i>
                                        <span>Pilih File Dari Perangkat</span>
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            className="hidden" 
                                            onChange={(e) => handleLocalImageUpload(e)} 
                                        />
                                    </label>
                                </div>
                            )}

                            <input 
                                type="text"
                                value={elem.caption}
                                onChange={(e) => updateElement(elem.id, 'caption', e.target.value)}
                                placeholder="Keterangan gambar (opsional)..."
                                className="w-full p-2 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500"
                            />
                        </div>
                    );

                case 'layout_2col':
                    return (
                        <div className="space-y-3">
                            <span className="font-semibold uppercase tracking-wider text-emerald-700 text-xs block">Layout 2 Kolom</span>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {/* Kolom 1 */}
                                <div className="border border-gray-200 p-3 rounded-lg bg-white space-y-2">
                                    <span className="text-[10px] font-bold text-gray-400 uppercase">Kolom 1</span>
                                    {elem.col1Type === 'image' ? (
                                        elem.col1Image ? (
                                            <img src={elem.col1Image} className="w-full h-32 object-cover rounded" />
                                        ) : (
                                            <label className="border border-dashed p-4 rounded text-center block cursor-pointer hover:bg-gray-50">
                                                <span className="text-xs text-emerald-600 font-semibold">+ Unggah Gambar</span>
                                                <input type="file" accept="image/*" className="hidden" onChange={(e) => handleLocalImageUpload(e, 'col1Image')} />
                                            </label>
                                        )
                                    ) : (
                                        <textarea 
                                            value={elem.col1Text} 
                                            onChange={(e) => updateElement(elem.id, 'col1Text', e.target.value)}
                                            className="w-full p-2 text-xs border rounded"
                                            rows={3}
                                        />
                                    )}
                                </div>

                                {/* Kolom 2 */}
                                <div className="border border-gray-200 p-3 rounded-lg bg-white space-y-2">
                                    <span className="text-[10px] font-bold text-gray-400 uppercase">Kolom 2</span>
                                    {elem.col2Type === 'image' ? (
                                        elem.col2Image ? (
                                            <img src={elem.col2Image} className="w-full h-32 object-cover rounded" />
                                        ) : (
                                            <label className="border border-dashed p-4 rounded text-center block cursor-pointer hover:bg-gray-50">
                                                <span className="text-xs text-emerald-600 font-semibold">+ Unggah Gambar</span>
                                                <input type="file" accept="image/*" className="hidden" onChange={(e) => handleLocalImageUpload(e, 'col2Image')} />
                                            </label>
                                        )
                                    ) : (
                                        <textarea 
                                            value={elem.col2Text} 
                                            onChange={(e) => updateElement(elem.id, 'col2Text', e.target.value)}
                                            className="w-full p-2 text-xs border rounded"
                                            rows={3}
                                        />
                                    )}
                                </div>
                            </div>
                        </div>
                    );

                case 'collapsible':
                    return (
                        <div className="space-y-2">
                            <span className="font-semibold uppercase tracking-wider text-emerald-700 text-xs block">Teks Terlipat (Collapsible)</span>
                            <input 
                                type="text"
                                value={elem.title}
                                onChange={(e) => updateElement(elem.id, 'title', e.target.value)}
                                placeholder="Judul Teks Terlipat"
                                className="w-full p-2 border border-gray-200 rounded font-semibold text-sm"
                            />
                            <textarea 
                                value={elem.content}
                                onChange={(e) => updateElement(elem.id, 'content', e.target.value)}
                                placeholder="Isi konten terlipat..."
                                className="w-full p-2 border border-gray-200 rounded text-xs"
                                rows={2}
                            />
                        </div>
                    );

                case 'callout':
                    return (
                        <div className="space-y-2">
                            <span className="font-semibold uppercase tracking-wider text-emerald-700 text-xs block">Kotak Sorotan (Callout)</span>
                            <div className="flex space-x-2">
                                <select 
                                    value={elem.bgType} 
                                    onChange={(e) => updateElement(elem.id, 'bgType', e.target.value)}
                                    className="border rounded p-1.5 text-xs bg-white"
                                >
                                    <option value="info">Info (Biru)</option>
                                    <option value="success">Sukses (Hijau)</option>
                                    <option value="warning">Peringatan (Kuning)</option>
                                </select>
                                <input 
                                    type="text"
                                    value={elem.text}
                                    onChange={(e) => updateElement(elem.id, 'text', e.target.value)}
                                    className="flex-1 p-2 border border-gray-200 rounded text-sm"
                                    placeholder="Isi catatan sorotan..."
                                />
                            </div>
                        </div>
                    );

                case 'button':
                    return (
                        <div className="space-y-2">
                            <span className="font-semibold uppercase tracking-wider text-emerald-700 text-xs block">Tombol Link</span>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <input 
                                    type="text"
                                    value={elem.label}
                                    onChange={(e) => updateElement(elem.id, 'label', e.target.value)}
                                    placeholder="Teks Tombol"
                                    className="p-2 border border-gray-200 rounded text-xs"
                                />
                                <input 
                                    type="text"
                                    value={elem.url}
                                    onChange={(e) => updateElement(elem.id, 'url', e.target.value)}
                                    placeholder="Tautan URL (https://...)"
                                    className="p-2 border border-gray-200 rounded text-xs"
                                />
                            </div>
                        </div>
                    );

                case 'youtube':
                    return (
                        <div className="space-y-2">
                            <span className="font-semibold uppercase tracking-wider text-emerald-700 text-xs block">Video YouTube</span>
                            <input 
                                type="text"
                                value={elem.url}
                                onChange={(e) => updateElement(elem.id, 'url', e.target.value)}
                                placeholder="Tempel Tautan URL Video YouTube (cth: https://www.youtube.com/watch?v=...)"
                                className="w-full p-2 border border-gray-200 rounded text-xs"
                            />
                        </div>
                    );

                case 'divider':
                    return (
                        <div className="py-2 flex items-center justify-between">
                            <span className="font-semibold uppercase tracking-wider text-emerald-700 text-xs">Garis Pembatas</span>
                            <hr className="flex-1 ml-4 border-gray-300" />
                        </div>
                    );

                default:
                    return null;
            }
        }

        function PublishedElementRenderer({ elem }) {
            const [isOpen, setIsOpen] = useState(false);

            switch (elem.type) {
                case 'text':
                    if (elem.style === 'heading') return <h2 className="text-2xl sm:text-3xl font-extrabold text-gray-900 border-b pb-2">{elem.text}</h2>;
                    if (elem.style === 'subheading') return <h3 className="text-xl font-bold text-gray-800">{elem.text}</h3>;
                    return <p className="text-gray-700 text-base leading-relaxed whitespace-pre-line">{elem.text}</p>;

                case 'image':
                    return elem.url ? (
                        <div className={`my-4 ${elem.align === 'center' ? 'text-center' : elem.align === 'right' ? 'text-right' : 'text-left'}`}>
                            <img src={elem.url} alt={elem.caption} className="max-w-full rounded-2xl shadow-md inline-block border border-gray-100" />
                            {elem.caption && <p className="text-xs text-gray-500 mt-2 italic">{elem.caption}</p>}
                        </div>
                    ) : null;

                case 'layout_2col':
                    return (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 my-4 items-center">
                            <div>
                                {elem.col1Type === 'image' && elem.col1Image ? (
                                    <img src={elem.col1Image} className="rounded-xl w-full h-auto shadow" />
                                ) : (
                                    <p className="text-gray-700 leading-relaxed">{elem.col1Text}</p>
                                )}
                            </div>
                            <div>
                                {elem.col2Type === 'image' && elem.col2Image ? (
                                    <img src={elem.col2Image} className="rounded-xl w-full h-auto shadow" />
                                ) : (
                                    <p className="text-gray-700 leading-relaxed">{elem.col2Text}</p>
                                )}
                            </div>
                        </div>
                    );

                case 'collapsible':
                    return (
                        <div className="border border-gray-200 rounded-xl overflow-hidden shadow-sm my-3">
                            <button 
                                onClick={() => setIsOpen(!isOpen)}
                                className="w-full bg-slate-50 hover:bg-slate-100 p-4 text-left font-semibold text-slate-800 flex justify-between items-center transition"
                            >
                                <span>{elem.title}</span>
                                <i className={`fas fa-chevron-down transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}></i>
                            </button>
                            {isOpen && (
                                <div className="p-4 bg-white text-gray-700 border-t border-gray-100 text-sm leading-relaxed">
                                    {elem.content}
                                </div>
                            )}
                        </div>
                    );

                case 'callout':
                    const bgStyle = elem.bgType === 'success' ? 'bg-emerald-50 border-emerald-500 text-emerald-900' :
                                    elem.bgType === 'warning' ? 'bg-amber-50 border-amber-500 text-amber-900' :
                                    'bg-sky-50 border-sky-500 text-sky-900';
                    return (
                        <div className={`p-4 border-l-4 rounded-r-xl my-4 flex items-start space-x-3 shadow-sm ${bgStyle}`}>
                            <i className="fas fa-info-circle mt-1 text-lg"></i>
                            <div className="text-sm font-medium">{elem.text}</div>
                        </div>
                    );

                case 'button':
                    return (
                        <div className="text-center my-6">
                            <a 
                                href={elem.url} 
                                target="_blank" 
                                rel="noreferrer"
                                className="inline-flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5"
                            >
                                <span>{elem.label}</span>
                                <i className="fas fa-external-link-alt text-xs"></i>
                            </a>
                        </div>
                    );

                case 'youtube':
                    const embedUrl = getYouTubeEmbedUrl(elem.url);
                    return embedUrl ? (
                        <div className="aspect-16-9 w-full rounded-2xl overflow-hidden shadow-lg my-6">
                            <iframe 
                                src={embedUrl} 
                                title="YouTube Video"
                                className="w-full h-full border-0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowFullScreen
                            ></iframe>
                        </div>
                    ) : null;

                case 'divider':
                    return <hr className="my-8 border-gray-200" />;

                default:
                    return null;
            }
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
