<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Nathanael</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Quill.js untuk WYSIWYG Editor (seperti Google Sites) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .ql-toolbar { background-color: #f8fafc; border-radius: 8px 8px 0 0; }
        .ql-container { background-color: #ffffff; color: #000; border-radius: 0 0 8px 8px; min-height: 150px; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="glass fixed w-full z-50 top-0 transition-all">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Nathanael.</h1>
            <div>
                <button id="loginBtn" onclick="showLogin()" class="text-sm bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-full transition font-semibold">Admin Login</button>
                <button id="logoutBtn" onclick="logout()" class="hidden text-sm bg-red-500 hover:bg-red-600 px-4 py-2 rounded-full transition font-semibold">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Header / Hero Section -->
    <header class="pt-32 pb-20 px-4 text-center">
        <h2 class="text-4xl md:text-6xl font-extrabold mb-4">Welcome to My <span class="text-blue-500">Universe</span></h2>
        <p class="text-gray-400 max-w-xl mx-auto text-lg">Kumpulan karya, proyek, dan pencapaian terbaik saya. Jelajahi portofolio saya di bawah ini.</p>
        
        <!-- Admin Control Panel (Hidden by default) -->
        <div id="adminPanel" class="hidden mt-8 p-6 glass rounded-xl max-w-4xl mx-auto">
            <h3 class="text-xl font-bold mb-4 text-left">Admin Panel : Tambah Portofolio</h3>
            <input type="text" id="projectTitle" placeholder="Judul Proyek..." class="w-full mb-3 p-3 rounded-lg bg-gray-800 text-white border border-gray-700 focus:outline-none focus:border-blue-500">
            <input type="text" id="projectImage" placeholder="URL Gambar (contoh: https://link-gambar.com/img.jpg)" class="w-full mb-3 p-3 rounded-lg bg-gray-800 text-white border border-gray-700 focus:outline-none focus:border-blue-500">
            
            <!-- WYSIWYG Editor -->
            <div id="editor" class="mb-4"></div>
            
            <button onclick="saveProject()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition">Publish Portofolio</button>
        </div>
    </header>

    <!-- Portfolio Grid -->
    <main class="flex-grow max-w-6xl mx-auto px-4 pb-20 w-full">
        <div id="portfolioContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Portofolio items akan muncul di sini via JavaScript -->
        </div>
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50">
        <div class="glass p-8 rounded-2xl w-96 relative">
            <button onclick="closeLogin()" class="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>
            <h3 class="text-2xl font-bold mb-6 text-center">Admin Access</h3>
            <input type="text" id="username" placeholder="Username" class="w-full mb-4 p-3 rounded-lg bg-gray-800 text-white border border-gray-700">
            <input type="password" id="password" placeholder="Password" class="w-full mb-6 p-3 rounded-lg bg-gray-800 text-white border border-gray-700">
            <button onclick="attemptLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">Login</button>
        </div>
    </div>

    <script>
        // Inisialisasi Quill Editor
        var quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Tulis deskripsi proyek, tambahkan teks, dll...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image'],
                    ['clean']
                ]
            }
        });

        // Kredensial Admin sesuai permintaan
        const ADMIN_USER = "nathanael25";
        const ADMIN_PASS = "Nathanael123@";
        let isAdmin = false;

        // Data awal portofolio
        let projects = JSON.parse(localStorage.getItem('portofolio_data')) || [
            {
                id: 1,
                title: "Desain UI/UX Modern",
                image: "https://images.unsplash.com/photo-1561070791-2526d30994b5?w=500&q=80",
                content: "<p>Ini adalah contoh proyek pertama yang menawan.</p>"
            }
        ];

        // Render Portofolio
        function renderProjects() {
            const container = document.getElementById('portfolioContainer');
            container.innerHTML = '';
            
            projects.forEach(proj => {
                container.innerHTML += `
                    <div class="cardBg rounded-xl overflow-hidden hover:transform hover:-translate-y-2 transition duration-300 shadow-lg border border-gray-800 flex flex-col">
                        <img src="${proj.image}" alt="${proj.title}" class="w-full h-48 object-cover">
                        <div class="p-6 flex-grow">
                            <h3 class="text-xl font-bold mb-2">${proj.title}</h3>
                            <div class="text-gray-400 text-sm mb-4 line-clamp-3">${proj.content}</div>
                        </div>
                        ${isAdmin ? `<button onclick="deleteProject(${proj.id})" class="bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white py-3 transition w-full font-semibold">Hapus Proyek</button>` : ''}
                    </div>
                `;
            });
        }

        // Login Logic
        function showLogin() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLogin() { document.getElementById('loginModal').classList.add('hidden'); }
        
        function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                isAdmin = true;
                closeLogin();
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                renderProjects();
                alert('Login Berhasil! Anda sekarang bisa mengedit portofolio.');
            } else {
                alert('Username atau Password salah!');
            }
        }

        function logout() {
            isAdmin = false;
            document.getElementById('loginBtn').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            renderProjects();
        }

        // CRUD Logic
        function saveProject() {
            const title = document.getElementById('projectTitle').value;
            const image = document.getElementById('projectImage').value || 'https://via.placeholder.com/500x300?text=No+Image';
            const content = quill.root.innerHTML; // Mengambil konten HTML dari editor

            if (!title) return alert("Judul proyek wajib diisi!");

            const newProject = {
                id: Date.now(),
                title,
                image,
                content
            };

            projects.unshift(newProject);
            localStorage.setItem('portofolio_data', JSON.stringify(projects));
            
            // Reset form
            document.getElementById('projectTitle').value = '';
            document.getElementById('projectImage').value = '';
            quill.setContents([]);
            
            renderProjects();
            alert("Portofolio berhasil ditambahkan!");
        }

        function deleteProject(id) {
            if(confirm("Yakin ingin menghapus portofolio ini?")) {
                projects = projects.filter(p => p.id !== id);
                localStorage.setItem('portofolio_data', JSON.stringify(projects));
                renderProjects();
            }
        }

        // Render awal
        renderProjects();
    </script>
</body>
</html>
